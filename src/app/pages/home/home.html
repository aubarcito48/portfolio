<section class="hero-section page-width" id="inicio" aria-labelledby="hero-title">
  <div class="hero-layout">
    <figure class="hero-portrait">
      <div class="portrait-frame">
        <img
          [src]="profile.photo"
          [alt]="'Retrato de ' + profile.name"
          width="972"
          height="1296"
          fetchpriority="high"
        />
      </div>
      <figcaption>
        <span class="caption-mark" aria-hidden="true"></span>
        {{ content.portraitCaption }}
      </figcaption>
    </figure>

    <div class="hero-copy">
      <p class="hero-greeting">{{ content.greeting }}</p>
      <h1 id="hero-title">
        <span>{{ profile.firstName }}</span>
        <span class="hero-last-name">{{ profile.lastName }}<span class="name-period">.</span></span>
      </h1>
      <p class="hero-specialty">{{ profile.specialty }}</p>

      <p class="hero-summary">{{ content.summary }}</p>

      <p class="hero-location">
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </svg>
        <span
          ><span class="visually-hidden">{{ content.locationLabel }}: </span
          >{{ profile.location }}</span
        >
      </p>

      <div class="hero-actions">
        <a class="button button-primary" href="#proyectos">
          {{ content.projectsLink }}
          <span aria-hidden="true">↗</span>
        </a>
        <a class="button button-secondary" href="#contacto">{{ content.contactLink }}</a>
      </div>

      <div class="hero-socials">
        <span>{{ content.socialLabel }}</span>
        <a [href]="profile.links.github" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a [href]="profile.links.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </div>
</section>
