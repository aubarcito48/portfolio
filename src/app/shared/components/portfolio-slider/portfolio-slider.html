<section
  class="slider-section page-width"
  [attr.aria-label]="i18n.text('Slider de presentación')"
  tabindex="0"
  (keydown)="handleKeydown($event)"
  (mouseenter)="setPointerInteraction(true)"
  (mouseleave)="setPointerInteraction(false)"
  (focusin)="setFocusInteraction(true)"
  (focusout)="handleFocusOut($event)"
  (pointerdown)="startSwipe($event)"
  (pointerup)="finishSwipe($event)"
  (pointercancel)="cancelSwipe()"
>
  <div class="slider-window">
    <div
      class="slider-track"
      [style.transform]="'translate3d(-' + activeIndex() * 100 + '%, 0, 0)'"
      [attr.aria-live]="interactionPaused() || prefersReducedMotion() ? 'polite' : 'off'"
    >
      @for (slide of slides; track slide.title; let index = $index) {
        <article
          class="slider-slide"
          role="group"
          [attr.aria-roledescription]="i18n.text('diapositiva')"
          [attr.aria-label]="index + 1 + i18n.text(' de ') + slides.length"
          [attr.aria-hidden]="index !== activeIndex()"
          [attr.inert]="index !== activeIndex() ? '' : null"
        >
          <img
            fill
            [ngSrc]="slide.image"
            sizes="(max-width: 640px) 100vw, 100vw"
            [priority]="index === 0"
            [alt]="i18n.text(slide.imageAlt)"
          />
          <div class="slide-content">
            <p class="slide-title">{{ i18n.text(slide.title) }}</p>
            <p class="slide-description">{{ i18n.text(slide.description) }}</p>
            @if (slide.link) {
              <a
                class="slide-link"
                [href]="slide.link.url"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ i18n.text(slide.link.label) }}
              </a>
            }
          </div>
        </article>
      }
    </div>

    <div class="slider-controls" role="group" [attr.aria-label]="i18n.text('Controles del slider')">
      @if (!prefersReducedMotion()) {
        <button
          class="slider-autoplay-toggle"
          type="button"
          [attr.aria-label]="autoplayPaused() ? i18n.text('Reanudar avance automático') : i18n.text('Pausar avance automático')"
          [attr.aria-pressed]="autoplayPaused()"
          (click)="toggleAutoplay()"
        >
          <span aria-hidden="true">{{ autoplayPaused() ? '▶' : 'Ⅱ' }}</span>
          <span>{{ autoplayPaused() ? i18n.text('Continuar') : i18n.text('Pausar') }}</span>
        </button>
      }

      <button
        class="slider-arrow slider-arrow-previous"
        type="button"
        [attr.aria-label]="i18n.text('Diapositiva anterior')"
        (click)="showPrevious()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.4 5 8.4 12l7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.4 5Z"></path>
        </svg>
      </button>

      <div class="slider-dots" role="group" [attr.aria-label]="i18n.text('Seleccionar diapositiva')">
        @for (slide of slides; track slide.title; let index = $index) {
          <button
            class="slider-dot"
            type="button"
            [class.active]="index === activeIndex()"
            [attr.aria-label]="i18n.text('Mostrar diapositiva ') + (index + 1) + ': ' + i18n.text(slide.title)"
            [attr.aria-current]="index === activeIndex() ? 'true' : null"
            (click)="selectSlide(index)"
          ></button>
        }
      </div>

      <button
        class="slider-arrow slider-arrow-next"
        type="button"
        [attr.aria-label]="i18n.text('Diapositiva siguiente')"
        (click)="showNext()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path d="m8.6 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"></path>
        </svg>
      </button>

      <p class="slider-watermark">dev nahuel</p>
    </div>
  </div>
</section>
