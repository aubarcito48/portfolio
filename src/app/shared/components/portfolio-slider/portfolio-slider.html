<section
  class="slider-section page-width"
  aria-label="Slider de presentación"
  tabindex="0"
  (keydown)="handleKeydown($event)"
  (mouseenter)="setPointerInteraction(true)"
  (mouseleave)="setPointerInteraction(false)"
  (focusin)="setFocusInteraction(true)"
  (focusout)="handleFocusOut($event)"
  (pointerdown)="startSwipe($event)"
  (pointerup)="finishSwipe($event)"
  (pointercancel)="cancelSwipe()"
>
  <div class="slider-window">
    <div
      class="slider-track"
      [style.transform]="'translate3d(-' + activeIndex() * 100 + '%, 0, 0)'"
      [attr.aria-live]="interactionPaused() || prefersReducedMotion() ? 'polite' : 'off'"
    >
      @for (slide of slides; track slide.title; let index = $index) {
        <article
          class="slider-slide"
          role="group"
          aria-roledescription="diapositiva"
          [attr.aria-label]="index + 1 + ' de ' + slides.length"
          [attr.aria-hidden]="index !== activeIndex()"
          [attr.inert]="index !== activeIndex() ? '' : null"
        >
          <img
            fill
            [ngSrc]="slide.image"
            sizes="(max-width: 640px) 100vw, 100vw"
            [priority]="index === 0"
            [alt]="slide.imageAlt"
          />
          <div class="slide-content">
            <p class="slide-title">{{ slide.title }}</p>
            <p class="slide-description">{{ slide.description }}</p>
            @if (slide.link) {
              <a
                class="slide-link"
                [href]="slide.link.url"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ slide.link.label }} <span aria-hidden="true">↗</span>
              </a>
            }
          </div>
        </article>
      }
    </div>

    <div class="slider-controls" role="group" aria-label="Controles del slider">
      <button
        class="slider-autoplay-toggle"
        type="button"
        [disabled]="prefersReducedMotion()"
        [attr.aria-label]="
          prefersReducedMotion()
            ? 'Avance automático desactivado por preferencia de movimiento reducido'
            : autoplayPaused()
              ? 'Reanudar avance automático'
              : 'Pausar avance automático'
        "
        [attr.aria-pressed]="autoplayPaused() || prefersReducedMotion()"
        (click)="toggleAutoplay()"
      >
        <span aria-hidden="true">{{
          prefersReducedMotion() ? '–' : autoplayPaused() ? '▶' : 'Ⅱ'
        }}</span>
        <span>{{
          prefersReducedMotion() ? 'Movimiento reducido' : autoplayPaused() ? 'Continuar' : 'Pausar'
        }}</span>
      </button>

      <button
        class="slider-arrow slider-arrow-previous"
        type="button"
        aria-label="Diapositiva anterior"
        (click)="showPrevious()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.4 5 8.4 12l7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.4 5Z"></path>
        </svg>
      </button>

      <div class="slider-dots" role="group" aria-label="Seleccionar diapositiva">
        @for (slide of slides; track slide.title; let index = $index) {
          <button
            class="slider-dot"
            type="button"
            [class.active]="index === activeIndex()"
            [attr.aria-label]="'Mostrar diapositiva ' + (index + 1) + ': ' + slide.title"
            [attr.aria-current]="index === activeIndex() ? 'true' : null"
            (click)="selectSlide(index)"
          ></button>
        }
      </div>

      <button
        class="slider-arrow slider-arrow-next"
        type="button"
        aria-label="Diapositiva siguiente"
        (click)="showNext()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path d="m8.6 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"></path>
        </svg>
      </button>

      <p class="slider-watermark">dev nahuel</p>
    </div>
  </div>
</section>
