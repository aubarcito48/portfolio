<header class="site-header">
  <div class="header-inner" (keydown.escape)="closeMenuOnEscape()">
    <a class="wordmark" href="#inicio" [attr.aria-label]="i18n.text('NA, Nahuel Argandoña, inicio')">
      NA<span>.</span>
    </a>

    <nav
      id="primary-navigation"
      class="primary-nav"
      [class.is-open]="menuOpen()"
      [attr.aria-label]="i18n.text('Navegación principal')"
      (click)="closeMenu()"
    >
      <a href="#inicio">{{ i18n.text('Inicio') }}</a>
      <a href="#sobre-mi">{{ i18n.text('Sobre mí') }}</a>
      <a href="#proyectos">{{ i18n.text('Proyectos') }}</a>
      <a href="#contacto">{{ i18n.text('Contacto') }}</a>
    </nav>

    <button
      class="language-toggle"
      type="button"
      [attr.aria-label]="i18n.text('Cambiar a inglés')"
      (click)="i18n.toggle()"
    >
      <span lang="es" [class.active]="i18n.language() === 'es'">ES</span>
      <span aria-hidden="true">/</span>
      <span lang="en" [class.active]="i18n.language() === 'en'">EN</span>
    </button>

    <button
      class="theme-toggle"
      type="button"
      [attr.aria-pressed]="theme() === 'light'"
      (click)="themeToggle.emit()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @if (theme() === 'dark') {
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
          ></path>
        } @else {
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
        }
      </svg>
      <span>{{ i18n.text('Tema') }}</span>
    </button>

    <button
      #menuToggleButton
      class="menu-toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? i18n.text('Cerrar menú') : i18n.text('Abrir menú')"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        @if (menuOpen()) {
          <path d="m6 6 12 12M18 6 6 18"></path>
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        }
      </svg>
    </button>
  </div>
</header>
