<header class="site-header">
  <div class="header-inner" (keydown.escape)="closeMenuOnEscape()">
    <a class="wordmark" href="#inicio" aria-label="NA, Nahuel Argandoña, inicio">
      NA<span>.</span>
    </a>

    <nav
      id="primary-navigation"
      class="primary-nav"
      [class.is-open]="menuOpen()"
      aria-label="Navegación principal"
      (click)="closeMenu()"
    >
      <a href="#inicio">Inicio</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      [attr.aria-pressed]="theme() === 'light'"
      (click)="themeToggle.emit()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @if (theme() === 'dark') {
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
          ></path>
        } @else {
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
        }
      </svg>
      <span>Tema</span>
    </button>

    <button
      #menuToggleButton
      class="menu-toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        @if (menuOpen()) {
          <path d="m6 6 12 12M18 6 6 18"></path>
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        }
      </svg>
    </button>
  </div>
</header>
